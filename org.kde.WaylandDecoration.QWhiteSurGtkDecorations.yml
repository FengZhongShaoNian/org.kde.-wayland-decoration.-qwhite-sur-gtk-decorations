id: org.kde.WaylandDecoration.QWhiteSurGtkDecorations
branch: 5.15-24.08
build-extension: true
sdk: org.kde.Sdk
runtime: org.kde.Platform
runtime-version: 5.15-24.08
appstream-compose: false
separate-locales: false
modules:
  - name: qwhitesurgtkdecorations
    buildsystem: cmake-ninja
    build-options:
      prefix: /usr/share/runtime/lib/plugins/QWhiteSurGtkDecorations
    config-opts:
      - -DQT_PLUGINS_DIR=/usr/share/runtime/lib/plugins/QWhiteSurGtkDecorations
    post-install:
      - install -Dm0644 org.kde.WaylandDecoration.QWhiteSurGtkDecorations.appdata.xml ${FLATPAK_DEST}/share/appdata
    sources:
      - type: git
        url: https://gitee.com/fengzhongshaonian/QWhiteSurGtkDecorations.git
        tag: 0.2.0
      - type: file
        path: org.kde.WaylandDecoration.QWhiteSurGtkDecorations.appdata.xml
